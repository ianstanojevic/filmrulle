name: Bygg macOS-app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "filmrulle.py"
      - "requirements.txt"
      - "filmrulle.icns"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14      # Apple Silicon (M1/M2/M3/M4)
            arch: arm64
          - os: macos-13      # Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bygg med PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name Filmrulle \
            --icon filmrulle.icns \
            --collect-all rawpy --collect-all pillow_heif \
            filmrulle.py

      - name: Zippa appen
        run: |
          cd dist
          zip -r ../Filmrulle-macOS-${{ matrix.arch }}.zip Filmrulle.app

      - uses: actions/upload-artifact@v4
        with:
          name: Filmrulle-macOS-${{ matrix.arch }}
          path: Filmrulle-macOS-${{ matrix.arch }}.zip
